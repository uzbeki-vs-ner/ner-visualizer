server {
    listen 80;
    server_name localhost;
    
    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;
    
    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    
    # Main location
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Health check endpoint for visualizer itself
    location = /visualizer-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }
    
    # Proxy API requests to the NER service
    location /api/ {
        # Remove /api prefix when forwarding to backend
        rewrite ^/api/(.*) /$1 break;
        
        # Proxy to the NER API service
        # When using docker-compose, use service name 'ner-api'
        # When running separately, use host.docker.internal
        proxy_pass http://host.docker.internal:8000;
        
        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
    
    # Proxy health check to NER service
    location = /healthz {
        proxy_pass http://host.docker.internal:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
